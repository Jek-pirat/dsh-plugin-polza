# Раз в день: вышла ли новая версия DeepSeek Harness (@deepseek-ai/dsh-llm-pi-ai в npm).
# Если да — ставит пакеты harness этой версии и гоняет типы и тесты. Падение = issue.
name: harness-compat
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Версии harness
        id: v
        run: |
          pinned=$(node -p 'require("./package.json").devDependencies["@deepseek-ai/dsh-llm-pi-ai"]')
          latest=$(npm view @deepseek-ai/dsh-llm-pi-ai dist-tags.next 2>/dev/null || npm view @deepseek-ai/dsh-llm-pi-ai version)
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"; echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned latest=$latest"
      - name: Проверка на новой версии
        if: steps.v.outputs.latest != steps.v.outputs.pinned
        run: |
          # Поднимаем пакеты harness и в dev-, и в peer-зависимостях: иначе peer на старой версии даёт ERESOLVE,
          # и проверка падает до типов (так было на rc.2/rc.3).
          V=${{ steps.v.outputs.latest }} node -e '
            const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json"))
            for (const k of ["devDependencies", "peerDependencies"])
              for (const n in p[k] ?? {}) if (n.startsWith("@deepseek-ai/dsh-")) p[k][n] = process.env.V
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2))'
          rm package-lock.json
          npm install --no-audit --no-fund
          npm run typecheck && npm test && npm run build
      - name: Issue о несовместимости
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Одна открытая issue на версию: повторные падения — комментарием, а не новой issue.
          title="DeepSeek Harness ${{ steps.v.outputs.latest }}: плагин не собирается"
          log="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Снова упала. Лог: $log" || true
          else
            gh issue create --title "$title" \
              --body "Проверка harness-compat упала на ${{ steps.v.outputs.latest }} (зафиксирована ${{ steps.v.outputs.pinned }}). Лог: $log" || true
          fi
